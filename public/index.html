<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf1e1"><title>Wedding Memories</title><style>
:root{font:16px/1.5 system-ui,sans-serif;color:#1e1810;background:#fbf1e1;--paper:#fffaf2;--gold:#a8823f;--line:#ead9b9}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0}header,main{max-width:620px;margin:auto;padding:16px}header{position:sticky;top:0;background:#fffaf2ed;z-index:2;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h1,h2,p{margin:0 0 12px}button,a{font:inherit}button{cursor:pointer}.nav,.filters,.presets,.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.nav a,.filters button,.presets button,.btn{border:1px solid var(--line);border-radius:24px;padding:9px 14px;background:var(--paper);color:#513d1c;text-decoration:none}.filters button.on,.presets button.on{background:#1d1710;color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:var(--paper);border-radius:16px;overflow:hidden}.card img,.card video{width:100%;aspect-ratio:1;object-fit:cover;display:block}.card p{padding:8px;margin:0}.box{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}input,textarea{font:inherit;max-width:100%;padding:10px;border:1px solid var(--line);border-radius:10px}label{display:block;margin:10px 0 4px}.btn{display:inline-block}.upload{position:relative;display:block;text-align:center;background:#20180f;color:white;border:0;border-radius:20px;padding:16px;margin:12px 0}.upload input{position:absolute;inset:0;opacity:0;width:100%;height:100%}#edit{position:fixed;inset:0;background:#0009;z-index:5;display:flex;align-items:flex-end;justify-content:center}.editor{background:var(--paper);width:min(100%,620px);max-height:96dvh;overflow:auto;padding:18px;border-radius:24px 24px 0 0}.editor canvas{width:100%;max-height:42dvh;object-fit:contain;background:#eee;border-radius:12px}.presets button{border:1px solid var(--line);border-radius:20px;padding:8px 12px}.slider{display:grid;grid-template-columns:80px 1fr 40px;gap:8px;align-items:center;margin:8px 0}.slider input{width:100%;padding:0}.status{white-space:pre-wrap;color:#695a40}.error{color:#a22}footer{height:30px}
</style></head><body>
<header><b id="title">Wedding Memories</b><a href="#upload">Add photos</a></header><main>
<h1>Wedding memories</h1><p id="blurb">Capture and share a memory.</p>
<nav class="nav"><a href="#album">Album</a><a href="#upload">Add photo/video</a><a href="#note">Write a note</a><a href="#voice">Voice</a></nav>
<section id="album" class="box"><h2>Album</h2><div class="filters"><button class="on" data-filter="all">All</button><button data-filter="photo">Photos</button><button data-filter="video">Videos</button><button data-filter="voice">Voice</button><button data-filter="note">Notes</button><button data-filter="mine">Mine</button></div><div class="grid" id="feed"></div><p class="status" id="feedStatus"></p></section>
<section id="upload" class="box"><h2>Add a memory</h2><label>Your name (optional)</label><input id="guest" maxlength="40" placeholder="Your name"><label class="upload">📷 Take a photo<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="upload">🖼️ Choose photos or videos<input id="picker" type="file" accept="image/*,video/*,.heic,.heif" multiple></label><p class="status" id="uploadStatus" aria-live="polite"></p></section>
<section id="note" class="box"><h2>Write a note</h2><textarea id="noteText" maxlength="600" placeholder="Wishing you both a lifetime of love…"></textarea><button class="btn" id="sendNote">Send note</button><p class="status" id="noteStatus"></p></section>
<section id="voice" class="box"><h2>Voice memory</h2><p>Choose an audio recording to share.</p><input id="audio" type="file" accept="audio/*"><button class="btn" id="sendAudio">Send audio</button><p class="status" id="voiceStatus"></p></section>
<footer></footer></main>
<div id="edit" hidden role="dialog" aria-modal="true"><div class="editor"><h2>Customize your photo</h2><canvas id="canvas"></canvas><div class="presets"><button class="on" data-preset="original">Original</button><button data-preset="warm">Warm</button><button data-preset="soft">Soft</button><button data-preset="crisp">Crisp</button><button data-preset="noir">Noir</button></div><div id="sliders"></div><button class="btn" id="useOriginal">Use original</button> <button class="btn" id="usePhoto">Use edited photo</button> <button class="btn" id="cancelEdit">Cancel</button></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let cfg={},filter='all',photo=null,img=null,vals={brightness:100,contrast:100,saturation:100,warmth:0,vignette:0};
const presets={original:[100,100,100,0,0],warm:[108,112,120,34,0],soft:[110,92,86,18,12],crisp:[102,120,110,0,0],noir:[92,138,0,0,18]};
$('#sliders').innerHTML=[['brightness','Light',70,140],['contrast','Contrast',80,160],['saturation','Color',0,180],['warmth','Warmth',0,60],['vignette','Vignette',0,50]].map(([k,n,min,max])=>`<label class="slider">${n}<input type="range" data-key="${k}" min="${min}" max="${max}" value="${vals[k]}"><span id="v-${k}">${vals[k]}</span></label>`).join('');
fetch('/api/config').then(r=>r.json()).then(c=>{cfg=c;$('#title').textContent=c.brand||c.title||'Wedding Memories';$('#blurb').textContent=c.blurb||''}).catch(()=>{});
$('#guest').value=localStorage.getItem('guestName')||'';$('#guest').oninput=e=>localStorage.setItem('guestName',e.target.value);
async function load(){try{let r=await fetch('/api/feed');if(r.status===403)r=await fetch('/api/mine');if(!r.ok)throw Error('Could not load album');let all=await r.json();let shown=all.filter(x=>filter==='all'||(filter==='mine'?x.mine:x.type===filter));$('#feed').innerHTML=shown.map(x=>`<article class="card">${x.type==='photo'?`<img loading="lazy" src="/thumb/${x.id}" alt="Photo">`:x.type==='video'?`<video controls preload="metadata" src="/media/${x.id}"></video>`:`<p>${x.type==='note'?esc(x.text):'🎙️ Voice message'}</p>`}<p>${esc(x.name||'A guest')}${x.mine?' · Mine':''}</p>${x.mine?`<button data-delete="${x.id}">Delete</button>`:''}</article>`).join('')||'<p>No memories yet.</p>';$('#feedStatus').textContent=''}catch(e){$('#feedStatus').textContent=e.message}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));load()});
$('#feed').onclick=async e=>{const b=e.target.closest('[data-delete]');if(!b)return;if(confirm('Delete this memory?')){const r=await fetch('/api/item/'+b.dataset.delete,{method:'DELETE'});if(r.ok)load()}};
function chosen(e){const files=[...e.target.files];e.target.value='';if(!files.length)return;if(files.length===1&&files[0].type.startsWith('image/')&&!/hei[cf]/i.test(files[0].name)){openEditor(files[0]);return}upload(files)}
$('#camera').onchange=chosen;$('#picker').onchange=chosen;
function openEditor(file){photo=file;vals={brightness:100,contrast:100,saturation:100,warmth:0,vignette:0};$$('[data-preset]').forEach(b=>b.classList.toggle('on',b.dataset.preset==='original'));$$('[data-key]').forEach(i=>i.value=vals[i.dataset.key]);img=new Image();const url=URL.createObjectURL(file);img.onload=()=>{draw();URL.revokeObjectURL(url)};img.onerror=()=>{URL.revokeObjectURL(url);$('#edit').hidden=true;upload([file])};img.src=url;$('#edit').hidden=false}
function draw(){if(!img)return;const c=$('#canvas'),ctx=c.getContext('2d'),scale=Math.min(1000/img.naturalWidth,1000/img.naturalHeight,1);c.width=Math.round(img.naturalWidth*scale);c.height=Math.round(img.naturalHeight*scale);ctx.filter=`brightness(${vals.brightness}%) contrast(${vals.contrast}%) saturate(${vals.saturation}%)`;ctx.drawImage(img,0,0,c.width,c.height);ctx.filter='none';if(vals.warmth){ctx.fillStyle=`rgba(255,160,50,${vals.warmth/250})`;ctx.fillRect(0,0,c.width,c.height)}if(vals.vignette){const g=ctx.createRadialGradient(c.width/2,c.height/2,Math.min(c.width,c.height)*.15,c.width/2,c.height/2,Math.max(c.width,c.height)*.75);g.addColorStop(0,'transparent');g.addColorStop(1,`rgba(0,0,0,${vals.vignette/75})`);ctx.fillStyle=g;ctx.fillRect(0,0,c.width,c.height)}}
$$('[data-preset]').forEach(b=>b.onclick=()=>{const a=presets[b.dataset.preset];['brightness','contrast','saturation','warmth','vignette'].forEach((k,i)=>{vals[k]=a[i];$(`[data-key="${k}"]`).value=a[i];$(`#v-${k}`).textContent=a[i]});$$('[data-preset]').forEach(x=>x.classList.toggle('on',x===b));draw()});
$$('[data-key]').forEach(i=>i.oninput=()=>{vals[i.dataset.key]=+i.value;$(`#v-${i.dataset.key}`).textContent=i.value;$$('[data-preset]').forEach(b=>b.classList.remove('on'));draw()});
$('#cancelEdit').onclick=()=>{$('#edit').hidden=true;photo=null};$('#useOriginal').onclick=()=>{const f=photo;$('#edit').hidden=true;upload([f])};$('#usePhoto').onclick=()=>$('#canvas').toBlob(b=>{if(!b)return;const f=new File([b],(photo.name||'photo').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'});$('#edit').hidden=true;upload([f])},'image/jpeg',.92);
async function upload(files){const status=$('#uploadStatus');status.textContent=`Uploading ${files.length} file(s)…`;for(const file of files){try{const fd=new FormData();fd.append('file',file);const q=new URLSearchParams({name:$('#guest').value||'',cat:''});const r=await fetch('/upload?'+q,{method:'POST',body:fd});const j=await r.json();if(!r.ok)throw Error(j.error||'Upload failed')}catch(e){status.textContent='Upload error: '+e.message;return}}status.textContent='Upload complete.';load()}
$('#sendNote').onclick=async()=>{const text=$('#noteText').value.trim();if(!text)return;const r=await fetch('/note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#guest').value,text})});$('#noteStatus').textContent=r.ok?'Note sent.':'Could not send note.';if(r.ok){$('#noteText').value='';load()}};
$('#sendAudio').onclick=async()=>{const f=$('#audio').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);const r=await fetch('/upload?kind=voice&name='+encodeURIComponent($('#guest').value||''),{method:'POST',body:fd});$('#voiceStatus').textContent=r.ok?'Voice memory sent.':'Could not send audio.';if(r.ok)load()};
load();
</script></body></html>
